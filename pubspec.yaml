name: shard_xl
description: "ShardXL - Minecraft Java Edition Launcher for Desktop & Android"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Networking
  dio: ^5.7.0

  # Local Storage
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5

  # File Picker
  file_picker: ^8.1.6

  # Window Management (Desktop)
  window_manager: ^0.4.3

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flex_color_scheme: ^8.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  injectable_generator: ^2.6.3

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
