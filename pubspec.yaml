name: shard_xl
description: "ShardXL - Minecraft Java Edition Launcher for Desktop & Android"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Storage
  shared_preferences: ^2.3.4

  # HTTP Client
  http: ^1.2.0

  # Window Management (Desktop)
  window_manager: ^0.4.3
  flutter_acrylic: ^1.1.4
  bitsdojo_window: ^0.1.6

  # Minecraft Launcher
  # dartcraft: ^1.0.1  # Removed - using ShardXL-Lib
  
  # Image Picker
  image_picker: ^1.1.2

  # FFI
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/